<app-container>
  <header>
    <section class="cabecalho-link">
      <img src="../../../assets/img/logo.png" alt="" />
    </section>
    <section class="cabecalho-contato">
      <img src="../../../assets/img/adicionar-contato.png" alt="" />
      <h1>Adicionar contato</h1>
    </section>
  </header>

  <form [formGroup]="contatoForm">
    <label for="nome"></label>
    <input
      type="text"
      id="nome"
      placeholder="Digite o nome do contato"
      formControlName="nome"
    />

    <label for="telefone"></label>
    <input
      type="text"
      id="telefone"
      placeholder="Digite o telefone do contato"
      formControlName="telefone"
    />

    <label for="email"></label>
    <input
      type="email"
      id="email"
      placeholder="Digite o email do contato"
      formControlName="email"
    />

    <app-separador></app-separador>

    <label for="aniversario"></label>
    <input
      type="date"
      id="aniversario"
      placeholder="Data de nascimento"
      formControlName="aniversario"
    />

    <label for="redes"></label>
    <div class="input-container">
      <span class="span-http">http://</span>
      <input
        type="url"
        id="redes"
        placeholder="Adicione a URL da página"
        formControlName="redes"
      />
    </div>

    <label for="observacoes"></label>
    <textarea
      id="observacoes"
      type="text"
      placeholder="Digite observacoes"
      formControlName="observacoes"
    ></textarea>

    <section class="botoes">
      <button class="botao-cancelar" type="button">Cancelar</button>
      <button class="botao-salvar" type="submit">Salvar contato</button>
    </section>
  </form>
</app-container>
